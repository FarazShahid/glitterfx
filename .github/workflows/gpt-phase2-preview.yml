name: GPT Phase 2 Visual Preview

on:
  push:
    branches: [gpt-v2-phase2-effects]
    paths:
      - 'v2/**'
      - '.github/workflows/gpt-phase2-preview.yml'
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - name: Start V2 playground
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/glitterfx-vite.log 2>&1 &
          echo $! > /tmp/glitterfx-vite.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/fixtures.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/glitterfx-vite.log
          exit 1
      - name: Capture Phase 2 effects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/glitterfx-preview
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" --version
          FLAGS="--headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --virtual-time-budget=2500"
          "$CHROME" $FLAGS --window-size=1400,800 --screenshot=/tmp/glitterfx-preview/warp-speed.png "http://127.0.0.1:4173/fixtures.html?effects=warp-speed&renderers=canvas,webgl&t=2.4&seed=42&glow=0.8&haze=0.5"
          "$CHROME" $FLAGS --window-size=1400,800 --screenshot=/tmp/glitterfx-preview/bioluminescent-ocean.png "http://127.0.0.1:4173/fixtures.html?effects=bioluminescent-ocean&renderers=canvas,webgl&t=5.2&seed=42&glow=0.8&haze=0.7"
          "$CHROME" $FLAGS --window-size=1400,800 --screenshot=/tmp/glitterfx-preview/accretion-disk.png "http://127.0.0.1:4173/fixtures.html?effects=accretion-disk&renderers=canvas,webgl&t=4.0&seed=42&glow=0.8&haze=0.75"
          "$CHROME" $FLAGS --window-size=1400,800 --screenshot=/tmp/glitterfx-preview/planetary-rings.png "http://127.0.0.1:4173/fixtures.html?effects=planetary-rings&renderers=canvas,webgl&t=4.0&seed=42&glow=0.7&haze=0.55"
          "$CHROME" $FLAGS --window-size=1400,4100 --screenshot=/tmp/glitterfx-preview/ambient-pack.png "http://127.0.0.1:4173/fixtures.html?effects=pollen-drift,falling-ash,dust-motes,dandelion-seeds,rising-lanterns&renderers=canvas,webgl&t=6.0&seed=42&glow=0.65&haze=0.4"
      - uses: actions/upload-artifact@v4
        with:
          name: gpt-phase2-effect-screenshots
          path: /tmp/glitterfx-preview/*.png
          if-no-files-found: error
          retention-days: 14
