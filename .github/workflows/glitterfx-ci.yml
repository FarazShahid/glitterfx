name: GlitterFX CI

on:
  push:
    branches: [main, 'unify-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  v1-guard:
    name: v1-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard legacy V1 runtime assets
        run: node v2/scripts/verify-governance.mjs

  v2-checks:
    name: v2-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run pack:check
