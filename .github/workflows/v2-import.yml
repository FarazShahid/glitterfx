name: V2 One-shot Import

on:
  push:
    branches: [v2-engine]
    paths:
      - '.v2-import/**'
      - '.github/workflows/v2-import.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - name: Reconstruct uploaded V2 archive
        shell: bash
        run: |
          set -euo pipefail
          cat .v2-import/part-* | base64 -d > /tmp/glitterfx-v2-code.zip
          rm -rf /tmp/glitterfx-v2-import
          mkdir -p /tmp/glitterfx-v2-import
          unzip -q /tmp/glitterfx-v2-code.zip -d /tmp/glitterfx-v2-import
          test -f /tmp/glitterfx-v2-import/glitterfx/v2/package.json
          test -f /tmp/glitterfx-v2-import/glitterfx/v2/packages/core/src/glitterfx.ts
      - name: Replace V2 workspace from uploaded working code
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v2
          cp -a /tmp/glitterfx-v2-import/glitterfx/v2 ./v2
          cp /tmp/glitterfx-v2-import/glitterfx/.github/workflows/v2-governance.yml .github/workflows/v2-governance.yml
      - name: Verify imported V2
        working-directory: v2
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          npm run pack:check
      - name: Commit verified V2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v2-import
          rm -f .github/workflows/v2-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(v2): import working dual-backend V2 codebase"
          git push origin HEAD:v2-engine
