name: V2 Governance

on:
  push:
    branches: [v2-engine, 'v2/**']
  pull_request:
    branches: [v2-engine]

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Governance self-test
        run: node v2/scripts/verify-governance.mjs --self-test
      - name: Protect V1
        run: node v2/scripts/verify-governance.mjs

  v2-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run pack:check
