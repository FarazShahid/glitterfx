<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GlitterFX V1 Effect Lab — Legacy Preview</title>
  <meta name="description" content="Live preview playground for every GlitterFX effect." />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <div class="brand-title">GlitterFX</div>
          <div class="brand-subtitle">Effect Lab</div>
        </div>
      </div>

      <div class="sidebar-meta">
        <span class="pill">V1 reference runtime</span>
        <span class="effect-count" id="effect-count">0 effects</span>
      </div>

      <label class="search-wrap">
        <span class="sr-only">Search effects</span>
        <input id="effect-search" type="search" placeholder="Search effects…" autocomplete="off" />
      </label>

      <nav id="effect-list" class="effect-list" aria-label="Effects"></nav>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <div class="eyebrow">Live preview</div>
          <h1 id="effect-title">Loading…</h1>
        </div>
        <div class="topbar-actions">
          <button class="button ghost" id="prev-effect" type="button">← Prev</button>
          <button class="button ghost" id="next-effect" type="button">Next →</button>
          <button class="button" id="autoplay" type="button" aria-pressed="false">Autoplay</button>
        </div>
      </header>

      <section class="stage-panel">
        <div class="stage-shell">
          <div id="fx-stage" class="fx-stage" aria-label="GlitterFX live effect preview"></div>

          <div class="stage-hud">
            <div class="hud-left">
              <span class="status-dot"></span>
              <span id="runtime-status">Running</span>
            </div>
            <div class="hud-right">
              <span id="fps-readout">-- FPS</span>
            </div>
          </div>

          <div class="stage-caption">
            <span id="stage-effect-name">—</span>
            <span class="stage-caption-sep">/</span>
            <span id="stage-palette-name">—</span>
          </div>
        </div>
      </section>

      <section class="control-panel">
        <div class="control-panel-head">
          <div>
            <div class="eyebrow">Tune the effect</div>
            <h2>Controls</h2>
          </div>
          <div class="control-panel-actions">
            <button class="button ghost" id="reset-controls" type="button">Reset</button>
            <button class="button ghost" id="pause-toggle" type="button">Pause</button>
            <button class="button" id="copy-config" type="button">Copy config</button>
          </div>
        </div>

        <div class="controls-grid">
          <label class="control select-control">
            <span>Palette</span>
            <select id="palette"></select>
          </label>

          <label class="control select-control">
            <span>Blur mode</span>
            <select id="blur-mode"></select>
          </label>

          <label class="control">
            <span>Density <output id="density-value"></output></span>
            <input id="density" type="range" min="0.15" max="2" step="0.05" />
          </label>

          <label class="control">
            <span>Speed <output id="speed-value"></output></span>
            <input id="speed" type="range" min="0.05" max="3" step="0.05" />
          </label>

          <label class="control">
            <span>Size <output id="size-value"></output></span>
            <input id="size" type="range" min="0.2" max="3" step="0.05" />
          </label>

          <label class="control">
            <span>Brightness <output id="brightness-value"></output></span>
            <input id="brightness" type="range" min="0.1" max="2.5" step="0.05" />
          </label>

          <label class="control">
            <span>Blur <output id="blur-value"></output></span>
            <input id="blur" type="range" min="0" max="20" step="0.5" />
          </label>

          <label class="control">
            <span>Haze <output id="haze-value"></output></span>
            <input id="haze" type="range" min="0" max="1" step="0.05" />
          </label>
        </div>

        <details class="config-drawer">
          <summary>Current configuration</summary>
          <pre id="config-output"></pre>
        </details>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./glitterfx.js"></script>
  <script src="./app.js"></script>
</body>
</html>
